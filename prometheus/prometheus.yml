global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'system-monitoring'

rule_files:
  - "rules/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # PostgreSQL Exporter - VIA DOCKER GATEWAY
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['172.17.0.1:9187']  # ✅ Via Docker gateway - works from container
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics

  # Node Exporter - CONTAINER NAME
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']  # ✅ Container name - same network
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics

alerting:
  alertmanagers:
    - static_configs:
        - targets: [] 