version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: kasep_postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=public
    ports:
      - "5445:5432"
    volumes:
      - kasep_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0.1
    container_name: kasep_redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    volumes:
      - kasep_redis_data:/data

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: kasep_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/public?sslmode=disable"
    ports:
      - "9187:9187"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kasep_postgres_data:
  kasep_redis_data: